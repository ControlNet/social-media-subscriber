[project]
name = "social-media-subscriber"
version = "0.1.0"
description = "A deterministic LinkedIn subscription collector"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "pillow>=11,<13",
    "anyio>=4.10,<5",
    "httpx2[brotli,http2,zstd]>=2,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25,<26",
    "typer>=0.16,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "coverage>=7.10,<8",
    "hypothesis>=6.138,<7",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.pixi", "**/build", "**/dist"]
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["D104"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = ["media_pipeline: exercise the real archive application seam with synthetic downloads"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
