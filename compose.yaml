services:
  subscriber:
    image: controlnet/social-media-subscriber:latest
    build: .
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - ${SOCIAL_MEDIA_DATA_DIR:?Set SOCIAL_MEDIA_DATA_DIR to the public snapshot directory}:/data
      - subscriber-state:/state

volumes:
  subscriber-state:
