name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          pixi-version: v0.59.0
          run-install: false
          cache: false
      - name: Install locked environment
        run: pixi install --locked
      - name: Verify
        run: pixi run verify

  docker:
    needs: verify
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: social-media-subscriber-docker
      cancel-in-progress: true
    steps:
      - name: Gate Docker Hub credentials
        id: gate
        env:
          HAS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_USERNAME" == "true" && "$HAS_PASSWORD" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker publication disabled: Docker Hub credentials are not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Docker image
        if: steps.gate.outputs.enabled == 'true'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/social-media-subscriber:latest
        run: docker build --platform linux/amd64 --tag "$IMAGE" .
      - name: Publish Docker image
        if: steps.gate.outputs.enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/social-media-subscriber:latest
        run: |
          set -euo pipefail
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE"
